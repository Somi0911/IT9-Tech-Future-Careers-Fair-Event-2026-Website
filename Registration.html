<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - Tech Future Careers Fair Event 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar">
        <div class="LOGO">
            <img src="Images/LOGO.jpeg" alt="LOGO">
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="About.html">About</a>
            <a href="ContactUs.html">Contact</a>
            <a href="Registration.html">Registration</a>
            <a href="EventLocation.html">Event Location</a>
            <a href="Registration.html"><button class="register-button">Register Now!</button></a>
        </nav>
    </div>
    
    <div class="main-content">
        <div class="registration-container">
            <h1>Registration</h1>
            <p>Registration for the Tech Future Careers Fair Event 2026 is now open. Register below to secure your spot at this exciting event.</p>
            
            <form class="registration-form">
                <div class="form-group">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="school">School/University:</label>
                    <input type="text" id="school" name="school">
                </div>
                
                <div class="form-group">
                    <label for="interest">Area of Interest:</label>
                    <select id="interest" name="interest">
                        <option>Select an area</option>
                        <option>Software Development</option>
                        <option>Cybersecurity</option>
                        <option>Data & AI</option>
                        <option>IT Support & Networking</option>
                        <option>Digital Marketing</option>
                        <option>UX/UI Design</option>
                        <option>Cloud Computing</option>
                    </select>
                </div>
                
                <button type="submit" class="submit-btn">Register</button>
            </form>
        </div>
    </div>
</body>

</html>
